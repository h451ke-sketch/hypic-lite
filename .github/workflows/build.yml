name: Build Hypic Lite (Android APK & iOS IPA)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub web UI

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate platform files
        run: flutter create . --org com.example --project-name hypic_lite --platforms=android

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: hypic-lite-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  build-ios:
    name: Build iOS IPA (For Sideloadly / AltStore)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate platform files
        run: flutter create . --org com.example --project-name hypic_lite --platforms=ios

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App without codesign
        run: flutter build ios --release --no-codesign

      - name: Package .app into .ipa for Sideloading
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r -9 hypic_lite.ipa Payload
          cd ../../..

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: hypic-lite-ios-ipa
          path: build/ios/iphoneos/hypic_lite.ipa
          retention-days: 14
